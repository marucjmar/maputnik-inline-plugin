<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Layer Editor</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.6.0/dist/maplibre-gl.css" />

  <link rel="stylesheet" href="./dist/maputnik-inline.css" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      height: 90vh;
      width: 100%;
    }
  </style>
</head>

<body>

  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@^6.6.0/dist/maplibre-gl.mjs";
    import { MaputnikControl } from "./dist/maputnik-inline.js";

    // MapLibre
    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [4, 42],
      zoom: 4,
    });

    const styleEditorControl = new MaputnikControl();
    map.addControl(styleEditorControl, "top-left");

    map.on('styledata', () => {
      console.log("Style changed");
    });

    // setTimeout(() => {
    //     map.removeControl(styleEditorControl);
    // }, 4000);
  </script>

  <div id="map"></div>

  <script>
    window.process = {
      env: {}
    };
  </script>
</body>

</html>
